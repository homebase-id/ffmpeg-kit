name: android build

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
  # Homebase fork: this r27d build produces the SHIPPED Android AAR, so
  # it gates PRs (it's the "Android r27d" that actually matters). The
  # broader multi-NDK android-build-scripts.yml is dispatch-only.
  pull_request:

jobs:
  build-android-main-on-linux:
    name: android main on linux
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # NDK r27+ defaults to 16KB ELF page-size alignment, required by
        # Android 15+ on 16KB-page devices. See U12 in CUSTOMIZATION.md.
        ndk-version: [ 'r27d-linux' ]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: set up adopt jdk 17
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install autoconf automake libtool pkg-config curl git doxygen nasm cmake gcc gperf texinfo yasm bison autogen wget autopoint meson ninja-build ragel groff gtk-doc-tools libtasn1-bin
      - name: prerequisites 2
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --uninstall "cmake;3.10.2.4988404" "cmake;3.18.1"
      - name: upgrade meson
        run: pip install meson --upgrade
      - name: set up android ndk
        run: |
          curl -s "https://dl.google.com/android/repository/android-ndk-${{ matrix.ndk-version }}.zip" -o ndk.zip
          unzip -q -o ndk.zip -d .ndk
          NDK_ROOT="$PWD/.ndk/$(ls .ndk)"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV
          # U18: NDK r27d ships a host x86_64 libxml2.so in its toolchain
          # lib dir. FFmpeg's libxml2 link probe finds the host copy ahead
          # of our cross-compiled one and fails with "incompatible with
          # armelf_linux_eabi". Remove it — clang doesn't need it for
          # cross-compile.
          rm -f "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/lib/libxml2.so" \
                "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/lib/libxml2.so."*
      - name: run the build script
        # --disable-lib-libaom: clang 18 (NDK r27d) rejects libaom 3.6.1's
        # missing forward declarations. chat-kmp doesn't use AV1 encoding.
        # See U13 in CUSTOMIZATION.md.
        # --disable-lib-sdl: clang 18 rejects SDL 2.0.8's OpenGLES2
        # incompatible function pointer types. chat-kmp doesn't use SDL.
        # See U14.
        # --disable-lib-libvpx: libvpx 1.13.0's configure assumes gcc
        # toolchain paths that NDK r27d removed. chat-kmp doesn't encode
        # VP9 (only decodes, which uses FFmpeg's native vp9 decoder).
        # See U17.
        # Note: libxml2 (U18) is handled at the NDK setup step above by
        # removing the host libxml2.so that ships with NDK r27d. The
        # cross-compiled libxml2 builds normally.
        #
        # B3 (size trim): build the MINIMAL external-library set via
        # explicit --enable flags instead of `--full` minus a long
        # --disable-lib list.
        #
        # Why not `--full --disable-lib-*`: that approach hangs 4h+ on
        # the CI runner. It's the U18 pattern — disabling a library that
        # FFmpeg's configure probes for sends configure into an
        # auto-detect / pkg-config retry loop (U18 saw the same with
        # --disable-lib-libxml2). Rather than bisect 28 disables across
        # 70-min builds, flip to the iOS strategy: don't use --full at
        # all, enable only what chat-kmp needs.
        #
        # chat-kmp's ffmpeg surface:
        #   - x264                 → software H.264 encode (only ext encoder)
        #   - android-media-codec  → HW H.264 encode/decode (h264_mediacodec)
        #   - android-zlib         → zlib (PNG, gzip, FFmpeg internals)
        #   - native built-in decoders (h264/hevc/vp8/vp9/av1/mpeg4/aac/
        #     mp3/...) — always compiled, need no external lib
        #   - native muxers/demuxers (mp4/mov/hls/mpegts/image2), scale
        #     (libswscale), AES-128 crypto, aac_adtstoasc BSF — built-in
        # TLS (gnutls/openssl) intentionally absent: chat-kmp feeds
        # ffmpeg local files only. See CUSTOMIZATION.md B3.
        run: ./android.sh --enable-gpl --disable-arm-v7a --enable-x264 --enable-android-media-codec --enable-android-zlib
      - name: Upload AAR as workflow artifact
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ffmpeg-kit-aar
          path: prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Release Asset (.integrity)
        id: upload-release-asset-integrity
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          allowUpdates: true
          artifacts: "prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar"
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: print build logs
        if: ${{ always() }}
        run: cat build.log
      - name: print ffbuild logs
        if: ${{ failure() }}
        run: '[[ -f ./src/ffmpeg/ffbuild/config.log ]] && tail -50 ./src/ffmpeg/ffbuild/config.log'